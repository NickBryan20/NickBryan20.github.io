name: Validate portfolio credentials

on:
  push:
    paths:
      - "data/credentials.json"
      - "index.html"
      - "scripts/sync-credentials.mjs"
      - "certificados/**"
  pull_request:
    paths:
      - "data/credentials.json"
      - "index.html"
      - "scripts/sync-credentials.mjs"
      - "certificados/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-credentials.mjs --check
